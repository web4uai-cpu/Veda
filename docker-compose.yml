# =============================================================================
# VEDA — Local Development Environment
# =============================================================================
# Usage: docker compose up -d
# Dashboard: Neo4j (http://localhost:7474) | Qdrant (http://localhost:6333/dashboard)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Neo4j — Knowledge Graph Database
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: veda-neo4j
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/vedadev2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "vedadev2026", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Qdrant — Vector Database for Semantic Search
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: veda-qdrant
    ports:
      - "6333:6333"   # REST API + Dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # OpenSearch — Full-Text Keyword Search
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: veda-opensearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Caching & Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: veda-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # PostgreSQL — Relational Data (Supabase-compatible schema)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: veda-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=veda
      - POSTGRES_PASSWORD=vedadev2026
      - POSTGRES_DB=veda
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veda"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  opensearch_data:
  redis_data:
  postgres_data:
